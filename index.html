<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 Hangman Game</h1>
        <p>Guess the word. 6 wrong guesses = Game Over</p>

        <div class="hangman-box">
            <svg id="hangman" width="200" height="250">
                <!-- Gallows -->
                <line x1="20" y1="230" x2="180" y2="230" stroke="#333" stroke-width="4"/>
                <line x1="50" y1="230" x2="50" y2="20" stroke="#333" stroke-width="4"/>
                <line x1="50" y1="20" x2="130" y2="20" stroke="#333" stroke-width="4"/>
                <line x1="130" y1="20" x2="130" y2="40" stroke="#333" stroke-width="4"/>

                <!-- Body Parts - hidden at start -->
                <circle id="head" cx="130" cy="60" r="20" stroke="#333" stroke-width="3" fill="none"/>
                <line id="body" x1="130" y1="80" x2="130" y2="140" stroke="#333" stroke-width="3"/>
                <line id="arm1" x1="130" y1="100" x2="110" y2="120" stroke="#333" stroke-width="3"/>
                <line id="arm2" x1="130" y1="100" x2="150" y2="120" stroke="#333" stroke-width="3"/>
                <line id="leg1" x1="130" y1="140" x2="110" y2="170" stroke="#333" stroke-width="3"/>
                <line id="leg2" x1="130" y1="140" x2="150" y2="170" stroke="#333" stroke-width="3"/>
            </svg>
        </div>

        <div id="word-display" class="word-box"></div>

        <p>Wrong Guesses: <span id="mistakes">0</span> / 6</p>

        <div id="keyboard" class="keyboard"></div>

        <div id="message"></div>

        <button id="restart" onclick="startGame()">New Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
