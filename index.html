<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>

    <div class="container">
        <header class="game-header">
            <h1>🎯 Hangman</h1>
            <p class="subtitle">Guess the hidden word before the hangman is complete!</p>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-icon">🏆</span>
                <span class="stat-label">Wins</span>
                <span id="wins" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-icon">🔥</span>
                <span class="stat-label">Streak</span>
                <span id="streak" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-icon">⭐</span>
                <span class="stat-label">Score</span>
                <span id="score" class="stat-value">0</span>
            </div>
        </div>

        <div class="controls-row">
            <div class="difficulty-group">
                <label>Difficulty</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <button id="hint-btn" class="hint-btn" onclick="useHint()">
                💡 Hint (<span id="hints-left">2</span>)
            </button>
        </div>

        <div id="category-badge" class="category-badge"></div>

        <div class="game-area">
            <div class="hangman-box">
                <svg id="hangman" viewBox="0 0 200 250" width="200" height="250">
                    <line x1="20" y1="230" x2="180" y2="230" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
                    <line x1="50" y1="230" x2="50" y2="20" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
                    <line x1="50" y1="20" x2="130" y2="20" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
                    <line x1="130" y1="20" x2="130" y2="40" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>

                    <circle id="head" cx="130" cy="60" r="20" stroke="#f43f5e" stroke-width="3" fill="none"/>
                    <line id="body" x1="130" y1="80" x2="130" y2="140" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
                    <line id="arm1" x1="130" y1="100" x2="110" y2="120" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
                    <line id="arm2" x1="130" y1="100" x2="150" y2="120" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
                    <line id="leg1" x1="130" y1="140" x2="110" y2="170" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
                    <line id="leg2" x1="130" y1="140" x2="150" y2="170" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>

            <div class="word-section">
                <div id="word-display" class="word-box"></div>
                <p id="hint-text" class="hint-text"></p>
            </div>
        </div>

        <div class="lives-section">
            <span class="lives-label">Lives</span>
            <div id="lives-bar" class="lives-bar"></div>
            <span id="mistakes" class="mistakes-count">0 / 6</span>
        </div>

        <div id="keyboard" class="keyboard"></div>

        <div id="message" class="message"></div>

        <button id="restart" class="restart-btn" onclick="startGame()">🔄 New Game</button>
    </div>

    <canvas id="confetti"></canvas>
    <script src="script.js"></script>
</body>
</html>
